name: training-pipeline-v1
version: "1.0"

stages:
  - name: preprocess
    image: preproc:2.1
    params:
      resize: [224, 224]
      normalize: true
      augment: false

  - name: train
    image: trainer:3.4
    params:
      device: cuda
      mixed_precision: false
      grad_clip: 1.0

  - name: evaluate
    image: evaluator:1.2
    params:
      metrics: [accuracy, f1]
      threshold: 0.5

notifications:
  on_failure: ops-team@example.com
  on_success: ml-team@example.com
